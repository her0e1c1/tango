      uid: user-1
      name: Study Deck A
      category: English
    - id: deck-b
      uid: user-1
      name: Study Deck B
      category: English
  cards:
    - id: card-a-1
      deckId: deck-a
      uid: user-1
      frontText: a-first
      backText: a first answer
      uniqueKey: a-first
    - id: card-a-2
      deckId: deck-a
      uid: user-1
      frontText: a-second
      backText: a second answer
      uniqueKey: a-second
    - id: card-b-1
