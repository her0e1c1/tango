extends: remote-deck-with-cards.yaml
remote:
  decks:
    - id: deck-1
      uid: user-1
      name: E2E Deck
    - id: plan
      uid: user-1
      name: Plain Deck
    - id: plan?draft=1
      uid: user-1
      name: Question mark Deck
    - id: plan#draft
      uid: user-1
      name: Hash Deck
  cards:
    - id: card-1
      uid: user-1
      deckId: deck-1
      frontText: apple
      backText: りんご
      uniqueKey: apple
    - id: plain-card
      deckId: plan
      uid: user-1
      frontText: Plain Card
      backText: Plain answer
      uniqueKey: plain
    - id: question-card
      deckId: plan?draft=1
      uid: user-1
      frontText: Question mark Card
      backText: Question mark answer
      uniqueKey: question
    - id: hash-card
      deckId: plan#draft
      uid: user-1
      frontText: Hash Card
      backText: Hash answer
      uniqueKey: hash
