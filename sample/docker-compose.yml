
x-image: &image
  image: tango-sample:${BRANCH:-latest}
  pull_policy: build
  build: .

x-base: &base
  <<: *image
  stdin_open: true
  tty: true
  working_dir: /workspace
  volumes:
    - ./build:/workspace/build
    - ./test:/workspace/test
    - ./generate.py:/workspace/generate.py
  entrypoint: bash

services:
  base: *base

  lock:
    image: python:3.13
    working_dir: /buildspace
    volumes:
      - ./Pipfile:/buildspace/Pipfile
      - .:/workspace:cached
    command:
      - bash
      - -c
      - |
        pip install --upgrade pip
        pip install pipenv
        pipenv lock
        cp /buildspace/Pipfile.lock /workspace
