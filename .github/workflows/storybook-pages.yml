name: Publish Storybook and E2E reports to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [dependabot-merged]

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  e2e:
    name: Record traces and retain E2E artifacts
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'repository_dispatch' || github.event.client_payload.sha != '')
    uses: ./.github/workflows/e2e.yaml

  build:
    name: Build Storybook and add the reviewed E2E report
    needs: e2e
    # E2E failures keep their artifacts and red status while Storybook delivery continues.
    if: >-
      !cancelled() &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    env:
      # Safety and browser-display verification are still pending; Storybook remains publishable.
      E2E_PUBLICATION_VERIFIED: "false"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's reviewed, successful E2E report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: report-download
        if: >-
          env.E2E_PUBLICATION_VERIFIED == 'true' && needs.e2e.result == 'success' &&
          needs.e2e.outputs.artifact-id != ''
        # A missing/unavailable report must not block the existing Storybook site.
        continue-on-error: true
        with:
          # Never search other runs or download an arbitrary latest artifact.
          artifact-ids: ${{ needs.e2e.outputs.artifact-id }}
          path: e2e-results
          merge-multiple: true

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install build dependencies
        run: mise run init
      - name: Build a fresh Storybook site at the root
        run: mise run build-storybook

      - name: Prepare the Pages URL
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - name: Copy the complete standard report into e2e/
        id: report
        if: ${{ steps.report-download.outcome == 'success' && hashFiles('e2e-results/index.html') != '' }}
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cp -a e2e-results storybook-static/e2e
          echo "[E2E report candidate](${BASE_URL%/}/e2e/) — source $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Pages snapshot is smaller than 1 GB
        run: |
          du -sb storybook-static
          test "$(du -sb storybook-static | cut -f1)" -lt 1000000000

      - name: Record the source and report status
        env:
          REPORT_STATUS: ${{ steps.report.outcome }}
        run: |
          echo "Source: $GITHUB_SHA; [publication run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT)." >> "$GITHUB_STEP_SUMMARY"
          echo "E2E report: $REPORT_STATUS (reviewed=$E2E_PUBLICATION_VERIFIED). Unreviewed or unavailable reports are omitted." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one Storybook and report Pages snapshot
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static/

  deploy:
    name: Publish the latest Pages snapshot
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip old commits and superseded publication runs
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The repository is public; these read-only lookups need no additional token permissions.
            // The Pages concurrency group serializes publication, including reruns of old commits.
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'storybook-pages.yml', branch: 'main', per_page: 1,
            });
            if (main.object.sha !== context.sha || runs.workflow_runs[0]?.id !== context.runId) {
              await core.summary.addRaw(`Skipped stale candidate ${context.sha} (run ${context.runId}).`).write();
              return;
            }
            core.setOutput('current', 'true');

      - name: Deploy the current Pages snapshot
        id: deployment
        if: ${{ steps.candidate.outputs.current == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
