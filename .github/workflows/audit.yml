name: Audit

on:
  workflow_dispatch:
    inputs:
      diagnose-retained-report:
        description: Inspect only fixed authentication field shapes in the retained failure report
        type: boolean
        default: false

  pull_request:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  # Keep diagnostic permissions outside reusable workflows called with contents: read only.
  diagnose-retained-report:
    name: Diagnose retained report field shapes
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.diagnose-retained-report &&
      github.repository == 'her0e1c1/tango' &&
      github.ref == 'refs/heads/test/1984-report-browser-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require the exact retained source and digest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: artifact } = await github.rest.actions.getArtifact({
              owner: 'her0e1c1', repo: 'tango', artifact_id: 12666865887,
            });
            const source = artifact.workflow_run;
            if (artifact.id !== 12666865887 || artifact.name !== 'playwright-report' || artifact.expired ||
                artifact.size_in_bytes !== 3817242 ||
                artifact.digest !== 'sha256:28fbc21c2e0d8e6c31649bf451f6c2746fe1b12bc4da75fc9c4a15a6c6332782' ||
                source?.id !== 40355926556 || source.repository_id !== 118316857 ||
                source.head_repository_id !== 118316857 ||
                source.head_sha !== '0b6539c33df97b6f7db459b83a190227747a9308') {
              core.setFailed('Retained report source does not match the approved diagnostic target.');
            }

      - name: Download only the bound original archive without extracting it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: her0e1c1/tango
          run-id: 40355926556
          artifact-ids: 12666865887
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained-report-diagnostic
          skip-decompress: true
          digest-mismatch: error

      - name: Classify fixed field names and structures without printing values
        env:
          DIAGNOSTIC_ARCHIVE_DIR: ${{ runner.temp }}/retained-report-diagnostic
        run: python3 scripts/diagnose-report-fields.py

  audit:
    name: Audit dependencies
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnose-retained-report }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.0.1

      - name: Audit dependencies
        # Temporarily allow audit failures on all PRs; resolve braces and remove this exception in #1872.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm audit --package-lock-only --audit-level=high
