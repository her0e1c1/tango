name: PR 1765 CI repair validation

on:
  push:
    branches: [maintenance/pr1765-ci-diagnostics]
    paths: [.github/workflows/pr1765-ci-diagnostics.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_HEAD: b7a0f1e991794502ff1bfa481f8d1d4bc1612233
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b7a0f1e991794502ff1bfa481f8d1d4bc1612233
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Prepare a worktree from current main
        run: |
          set -euo pipefail
          git fetch origin main refactor/align-e2e-file-pairs
          test "$(git rev-parse origin/refactor/align-e2e-file-pairs)" = "$PR_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add .worktrees/pr1765-ci-fix -b pr1765-ci-fix origin/main
          git -C .worktrees/pr1765-ci-fix merge --ff-only "$PR_HEAD"
      - name: Apply only the diagnosed fixes
        working-directory: .worktrees/pr1765-ci-fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(r'^import \{ (type \w+(?:, type \w+)*) \} from "@playwright/test";$', re.MULTILINE)
          count = 0
          for file in sorted(Path('test/e2e').glob('*.spec.ts')):
              before = file.read_text()
              after, matches = pattern.subn(lambda match: 'import type { ' + match[1].replace('type ', '') + ' } from "@playwright/test";', before)
              if matches:
                  file.write_text(after)
                  count += matches
          assert count == 10, f'Expected 10 type-only imports, found {count}'
          pending = Path('test/e2e/card-filter.spec.ts')
          assert pending.read_text().count('test.fixme(') == 11
          headings = re.findall(r'^### CARD-FILTER-.*$', Path('docs/test/e2e/card-filter.md').read_text(), re.MULTILINE)
          assert len(headings) == 11 and all('[TODO]' in heading for heading in headings)
          pending.write_text('// TODO: Implement the [TODO] cases in docs/test/e2e/card-filter.md.\n// Keep this paired file without registering empty or skipped tests.\n')
          file = Path('test/e2e/AGENTS.md')
          before = file.read_text()
          old = '- Every documented case must have at least one active test.'
          assert before.count(old) == 1
          after = before.replace(old, '- Every documented case without `[TODO]` must have at least one active test.')
          after = after.replace('- Run `npm run lint:test-specs`', '- Keep `[TODO]` cases in the specification without empty or skipped tests. If all cases are pending, retain the paired `.spec.ts` with only a TODO comment pointing to its specification.\n- Run `npm run lint:test-specs`')
          file.write_text(after)
          file = Path('docs/test/e2e/AGENTS.md')
          before = file.read_text()
          old = 'Explicit `[TODO]` cases remain unimplemented until their skipped tests receive real assertions.'
          assert before.count(old) == 1
          file.write_text(before.replace(old, 'Keep explicit `[TODO]` cases in the specification without empty or skipped tests; a fully pending specification retains a comment-only paired test file.'))
          print('Fixed 10 type-only imports; removed 11 empty skipped stubs without implementing pending cases.')
          PY
          git diff --check
          git diff --stat
          git add test/e2e docs/test/e2e/AGENTS.md
          git commit -m 'fix(test): preserve type imports and remove skipped TODO stubs'
          git fetch origin main
          git rebase origin/main
      - name: Validate from a normal checkout, not an ignored worktree path
        run: |
          set -euo pipefail
          git checkout --detach pr1765-ci-fix
          curl --fail --silent --show-error https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise trust
          mise install node npm hadolint
          mise run check || { npx biome lint --error-on-warnings --diagnostic-level=warn --max-diagnostics=none .; exit 1; }
          npx biome lint --error-on-warnings --diagnostic-level=warn --max-diagnostics=none .
          npx playwright test --list --reporter=json > "$RUNNER_TEMP/pr1765-tests.json"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re, subprocess
          root = Path('test/e2e')
          actual = {f.name.removesuffix('.spec.ts') for f in root.glob('*.spec.ts')}
          expected = {f.stem for f in Path('docs/test/e2e').glob('*.md') if f.name not in ('AGENTS.md', 'README.md')}
          assert actual == expected and len(actual) == 15
          report = json.loads(Path(os.environ['RUNNER_TEMP'], 'pr1765-tests.json').read_text())
          def titles(suites):
              for suite in suites:
                  for spec in suite.get('specs', []):
                      yield spec['title']
                  yield from titles(suite.get('suites', []))
          registered = list(titles(report['suites']))
          assert len(registered) == 122 and len(set(registered)) == 122, len(registered)
          assert not any(title.startswith('CARD-FILTER-') for title in registered)
          for file in root.glob('*.spec.ts'):
              if file.name == 'card-filter.spec.ts':
                  continue
              old = subprocess.check_output(['git', 'show', os.environ['PR_HEAD'] + ':' + str(file)], text=True)
              normalize = lambda text: re.sub(r'^import .*$', '', text, flags=re.MULTILINE)
              assert normalize(old) == normalize(file.read_text()), str(file)
          print('Validated 15 file pairs and all 122 original active test declarations; test bodies are unchanged.')
          PY
      - name: Publish the validated result branch only
        run: |
          set -euo pipefail
          git fetch origin main refactor/align-e2e-file-pairs
          test "$(git rev-parse origin/refactor/align-e2e-file-pairs)" = "$PR_HEAD"
          git merge-base --is-ancestor origin/main HEAD
          git diff --check origin/main
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:refs/heads/maintenance/pr1765-ci-result
          echo "VALIDATED_SHA=$(git rev-parse HEAD)"
          echo 'The temporary workflow is absent from the result branch. The custom reviewer gate has not been run.'
