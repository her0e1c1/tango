name: PR 1765 rebase validation

on:
  push:
    branches: [maintenance/pr1765-ci-diagnostics]
    paths: [.github/workflows/pr1765-ci-diagnostics.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_HEAD: ddc8934f83f2ce16f7352125c5cf4fca14a812cd
      OLD_BASE: 46bb114ef49f38b12090b8db0252d9da2015267c
      MAIN_HEAD: c30c6631c116c18317adae4f135871a44b981fd0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c30c6631c116c18317adae4f135871a44b981fd0
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Record current main test discovery
        run: |
          set -euo pipefail
          npm install --global npm@12.0.1
          npm ci
          npm run build:sample
          npx playwright test --list --reporter=json > "$RUNNER_TEMP/main-tests.json"
      - name: Reapply only the file reorganization on current main
        run: |
          set -euo pipefail
          git fetch origin main refactor/align-e2e-file-pairs
          test "$(git rev-parse origin/main)" = "$MAIN_HEAD"
          test "$(git rev-parse origin/refactor/align-e2e-file-pairs)" = "$PR_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add .worktrees/pr1765-rebase -b pr1765-rebase origin/main
          cd .worktrees/pr1765-rebase
          git diff --binary --no-renames "$OLD_BASE" "$PR_HEAD" -- test/e2e docs/test/e2e/AGENTS.md \
            ':(exclude)test/e2e/card-filter.spec.ts' \
            ':(exclude)test/e2e/card.spec.ts' \
            ':(exclude)test/e2e/deck-view.spec.ts' | git apply -
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const ts = require('typescript');
          const printer = ts.createPrinter({ removeComments: true });
          const parse = (name, text) => ts.createSourceFile(name, text, ts.ScriptTarget.Latest, true);
          const show = (ref, file) => execFileSync('git', ['show', `${ref}:${file}`], { encoding: 'utf8' });
          function testNode(source, id) {
            const found = [];
            function visit(node) {
              if (ts.isExpressionStatement(node) && ts.isCallExpression(node.expression)) {
                const call = node.expression;
                const title = call.arguments[0];
                if (ts.isIdentifier(call.expression) && call.expression.text === 'test' && title &&
                    ts.isStringLiteralLike(title) && title.text.startsWith(`${id} `)) found.push(node);
              }
              ts.forEachChild(node, visit);
            }
            visit(source);
            assert.equal(found.length, 1, `${source.fileName}: ${id}`);
            return found[0];
          }
          const canonical = (node, source) => printer.printNode(ts.EmitHint.Unspecified, node, source);
          for (const [original, destination, ids] of [
            ['test/e2e/card.spec.ts', 'test/e2e/card-list-actions.spec.ts', ['CARD-LIST-ACTIONS-01']],
            ['test/e2e/deck-view.spec.ts', 'test/e2e/navigation.spec.ts', ['NAVIGATION-10', 'NAVIGATION-11', 'NAVIGATION-12']],
          ]) {
            const base = parse(original, show(process.env.OLD_BASE, original));
            const main = parse(original, show(process.env.MAIN_HEAD, original));
            for (const id of ids) {
              const text = fs.readFileSync(destination, 'utf8');
              const target = parse(destination, text);
              const oldNode = testNode(base, id);
              const targetNode = testNode(target, id);
              const mainNode = testNode(main, id);
              assert.equal(canonical(targetNode, target), canonical(oldNode, base), `Unexpected PR edits to ${id}`);
              fs.writeFileSync(destination, text.slice(0, targetNode.getStart(target)) + mainNode.getText(main) + text.slice(targetNode.end));
              const replaced = parse(destination, fs.readFileSync(destination, 'utf8'));
              assert.equal(canonical(testNode(replaced, id), replaced), canonical(mainNode, main), `Lost main changes to ${id}`);
              console.log(`Preserved current main declaration: ${id} -> ${destination}`);
            }
          }
          assert.equal(fs.readFileSync('test/e2e/card-filter.spec.ts', 'utf8'), show(process.env.MAIN_HEAD, 'test/e2e/card-filter.spec.ts'));
          JS
          git rm test/e2e/card.spec.ts test/e2e/deck-view.spec.ts
          npx biome lint --write --only=correctness/noUnusedImports test/e2e/navigation.spec.ts
          npx biome format --write test/e2e/navigation.spec.ts test/e2e/card-list-actions.spec.ts
          git diff --check
          git add test/e2e docs/test/e2e/AGENTS.md
          git commit -m 'refactor(test): align E2E file pairs with current browsing filters'
          git fetch origin main
          git rebase origin/main
          test "$(git rev-parse origin/main)" = "$MAIN_HEAD"
      - name: Validate from the normal repository checkout
        run: |
          set -euo pipefail
          git checkout --detach pr1765-rebase
          curl --fail --silent --show-error https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise trust
          mise run check || { npx biome lint --error-on-warnings --diagnostic-level=warn --max-diagnostics=none .; exit 1; }
          npx playwright test --list --reporter=json > "$RUNNER_TEMP/rebased-tests.json"
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json, os, re, subprocess
          def specs(suites):
              for suite in suites:
                  yield from suite.get('specs', [])
                  yield from specs(suite.get('suites', []))
          def load(name):
              return list(specs(json.loads(Path(os.environ['RUNNER_TEMP'], name).read_text())['suites']))
          before, after = load('main-tests.json'), load('rebased-tests.json')
          assert Counter(item['title'] for item in before) == Counter(item['title'] for item in after), 'Test titles or multiplicities changed'
          docs = {file.stem: file for file in Path('docs/test/e2e').glob('*.md') if file.name not in ('AGENTS.md', 'README.md')}
          tests = {file.name.removesuffix('.spec.ts') for file in Path('test/e2e').glob('*.spec.ts')}
          assert tests == set(docs) and len(tests) == 15, 'File pairing mismatch'
          for item in after:
              document = docs[Path(item['file']).name.removesuffix('.spec.ts')]
              documented = set(re.findall(r'^### ([A-Z]+(?:-[A-Z]+)*-[0-9]{2,})\b', document.read_text(), re.MULTILINE))
              referenced = set(re.findall(r'\b[A-Z]+(?:-[A-Z]+)*-[0-9]{2,}\b', item['title']))
              assert referenced and referenced <= documented, (item['title'], str(document))
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['MAIN_HEAD'], 'HEAD'], text=True).splitlines()
          assert all(path.startswith('test/e2e/') or path == 'docs/test/e2e/AGENTS.md' for path in changed), changed
          subprocess.run(['git', 'diff', '--exit-code', os.environ['MAIN_HEAD'], 'HEAD', '--', 'test/e2e/card-filter.spec.ts'], check=True)
          print(f'Validated {len(after)} current-main tests, {len(tests)} file pairs, and unchanged new Card filter tests.')
          PY
      - name: Publish only the validated candidate
        run: |
          set -euo pipefail
          git fetch origin main refactor/align-e2e-file-pairs
          test "$(git rev-parse origin/main)" = "$MAIN_HEAD"
          test "$(git rev-parse origin/refactor/align-e2e-file-pairs)" = "$PR_HEAD"
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-list --count origin/main..HEAD)" = 1
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --check origin/main
          git push origin HEAD:refs/heads/maintenance/pr1765-rebase-result
          echo "VALIDATED_SHA=$(git rev-parse HEAD)"
          echo 'No temporary workflow is included. The custom reviewer gate is not available in this runner.'
