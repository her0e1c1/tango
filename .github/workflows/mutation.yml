name: Mutation testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: StrykerJS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.0.1

      - run: npm ci

      - name: Build sample data
        run: npm run build:sample

      - name: Run mutation tests
        run: npm run test:mutation -- --incremental --force

      - name: Warn on low mutation score
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { calculateMetrics } from 'mutation-testing-metrics';
          const report = JSON.parse(readFileSync('coverage/mutation/mutation.json', 'utf8'));
          const { metrics: { mutationScore } } = calculateMetrics(report.files);
          const { thresholds: { high } } = JSON.parse(readFileSync('stryker.config.json', 'utf8'));
          if (mutationScore < high) console.log(`::warning::Mutation score ${mutationScore.toFixed(2)}% is below ${high}%.`);
          NODE

      # Only successful full runs on main can supply PR baselines.
      - name: Save main baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-baseline
          path: coverage/mutation/stryker-incremental.json
          if-no-files-found: error

      - name: Upload mutation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: coverage/mutation/
          if-no-files-found: warn
