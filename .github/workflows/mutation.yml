name: Mutation testing

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mutate:
        description: Optional file pattern; leave blank to use the configured application scope
        required: false
        type: string

permissions:
  contents: read

jobs:
  mutation:
    name: StrykerJS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.0.1

      - run: npm ci

      - name: Build sample data
        run: npm run build:sample

      - name: Run mutation tests
        env:
          MUTATE: ${{ inputs.mutate }}
        run: |
          if [ -n "$MUTATE" ]; then
            npm run test:mutation -- --mutate "$MUTATE"
          else
            npm run test:mutation
          fi

      - name: Upload mutation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: coverage/mutation/
          if-no-files-found: warn
