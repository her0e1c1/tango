name: Deploy
run-name: Deploy ${{ github.event.client_payload.sha || github.sha }}

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [dependabot-merged]

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      accepted: ${{ steps.candidate.outputs.accepted }}
    steps:
      - name: Validate main candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          CANDIDATE_SHA="$EVENT_SHA"
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            CANDIDATE_SHA="$DISPATCH_SHA"
          fi
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$CANDIDATE_SHA" != "$EVENT_SHA" ] || [ "$CANDIDATE_SHA" != "$main_sha" ]; then
            echo "Candidate $CANDIDATE_SHA is superseded or mismatched (event $EVENT_SHA, main $main_sha); deployment skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "accepted=true" >> "$GITHUB_OUTPUT"
          echo "Accepted main candidate $CANDIDATE_SHA." >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: candidate
    if: needs.candidate.outputs.accepted == 'true'
    name: Test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [test]
    name: Deploy To Firebase
    permissions:
      contents: read
      id-token: write
    environment: production
    concurrency:
      group: firebase-production
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - run: echo VITE_PROJECT_ID="${{ secrets.VITE_PROJECT_ID }}" >> .env
      - run: echo VITE_WEB_API_KEY="${{ secrets.VITE_WEB_API_KEY }}" >> .env

      - run: mise run init

      - run: mise run build

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: tango-ts
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy current main candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$CANDIDATE_SHA" != "$main_sha" ]; then
            echo "Candidate $CANDIDATE_SHA was superseded by main $main_sha; refusing deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npx firebase deploy --project tango-ts --only hosting,firestore:rules,firestore:indexes
