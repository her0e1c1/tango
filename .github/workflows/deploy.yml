name: Deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [dependabot-merged]

permissions:
  contents: read

jobs:
  test:
    # Repository dispatch uses the latest default-branch SHA, which may have overtaken the merge.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'repository_dispatch' || github.event.client_payload.sha == github.sha)
    name: Test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [test]
    name: Deploy To Firebase
    permissions:
      contents: read
      id-token: write
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - run: echo VITE_PROJECT_ID="${{ secrets.VITE_PROJECT_ID }}" >> .env
      - run: echo VITE_WEB_API_KEY="${{ secrets.VITE_WEB_API_KEY }}" >> .env

      - run: mise run init

      - run: mise run build

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: tango-ts
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "::error::Candidate $GITHUB_SHA was superseded by main $main_sha; refusing deployment."
            exit 1
          fi
          npx firebase deploy --project tango-ts --only hosting,firestore:rules,firestore:indexes
