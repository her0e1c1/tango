name: Linter

on:
  workflow_call:
    inputs:
      lightweight:
        description: Report dependencies, check cycles, Markdown and test specifications
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linter:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.0.1

      - run: npm ci

      - name: Report module dependencies with Madge
        # Report counts without introducing quality thresholds; tool execution failures remain visible.
        run: npm run lint:madge -- --summary

      - name: Reject circular module dependencies
        run: npm run lint:madge:circular

      - name: Check Markdown and test specifications
        if: ${{ inputs.lightweight }}
        run: npm run lint:markdown && npm run lint:test-specs

      - name: Build sample data
        if: ${{ !inputs.lightweight }}
        run: npm run build:sample

      - name: Check formatting
        if: ${{ !inputs.lightweight }}
        run: npm run fmt && npm run fmt:sample

      - name: Run linters
        if: ${{ !inputs.lightweight }}
        run: npm run lint
