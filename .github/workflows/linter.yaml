name: Linter

on:
  workflow_call:
    inputs:
      lightweight:
        description: Run only Markdown and test-specification checks
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linter:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.0.1

      - run: npm ci

      - name: Check Markdown and test specifications
        if: ${{ inputs.lightweight }}
        run: npm run lint:markdown && npm run lint:test-specs

      - name: Build sample data
        if: ${{ !inputs.lightweight }}
        run: npm run build:sample

      - name: Check formatting
        if: ${{ !inputs.lightweight }}
        run: npm run fmt && npm run fmt:sample

      - name: Run linters
        if: ${{ !inputs.lightweight }}
        run: npm run lint
