name: PR mutation testing

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: mutation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mutation:
    name: StrykerJS / incremental
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.1
        id: changes
        with:
          predicate-quantifier: every
          filters: |
            source:
              - 'src/**/*.{ts,tsx}'
              - '!src/**/*.d.ts'
              - '!src/**/*.stories.{ts,tsx}'
            root-tests:
              - '*.spec.{ts,tsx}'
            setup:
              - 'test/setup.ts'

      - name: Skip unchanged targets
        if: ${{ steps.changes.outputs.changes == '[]' }}
        run: echo 'Skipped mutation testing because application and unit-test files are unchanged.' >> "$GITHUB_STEP_SUMMARY"

      - name: Find trusted baseline
        if: ${{ steps.changes.outputs.changes != '[]' }}
        id: baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'mutation.yml', branch: 'main',
              head_sha: context.payload.pull_request.base.sha,
              event: 'workflow_dispatch', status: 'success', per_page: 1,
            });
            const run = data.workflow_runs[0];
            if (run) {
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: run.id });
              if (artifacts.artifacts.some(artifact => artifact.name === 'mutation-baseline' && !artifact.expired)) {
                core.setOutput('run-id', run.id);
                return;
              }
            }
            await core.summary.addRaw('Skipped mutation testing: no retained successful manual main baseline exists for the PR base SHA.').write();

      - name: Restore baseline
        if: ${{ steps.baseline.outputs.run-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-baseline
          path: coverage/mutation
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Require restored baseline
        if: ${{ steps.baseline.outputs.run-id != '' }}
        run: test -s coverage/mutation/stryker-incremental.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.baseline.outputs.run-id != '' }}
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install npm
        if: ${{ steps.baseline.outputs.run-id != '' }}
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        if: ${{ steps.baseline.outputs.run-id != '' }}
        run: npm ci

      - name: Build sample data
        if: ${{ steps.baseline.outputs.run-id != '' }}
        run: npm run build:sample

      - name: Run incremental mutation tests
        if: ${{ steps.baseline.outputs.run-id != '' }}
        run: npm run test:mutation -- --incremental --incrementalFile coverage/mutation/stryker-incremental.json

      - name: Warn on low mutation score
        if: ${{ steps.baseline.outputs.run-id != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { calculateMetrics } from 'mutation-testing-metrics';
          const report = JSON.parse(readFileSync('coverage/mutation/mutation.json', 'utf8'));
          const { metrics: { mutationScore } } = calculateMetrics(report.files);
          const { thresholds: { high } } = JSON.parse(readFileSync('stryker.config.json', 'utf8'));
          if (mutationScore < high) console.log(`::warning::Mutation score ${mutationScore.toFixed(2)}% is below ${high}%.`);
          NODE

      - name: Upload PR mutation reports
        if: ${{ always() && steps.baseline.outputs.run-id != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-pr-report
          path: coverage/mutation/
          if-no-files-found: warn
