name: E2E

on:
  workflow_call:
    outputs:
      artifact-id:
        description: Report artifact from this exact run and attempt
        value: ${{ jobs.e2e.outputs.artifact-id }}
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: tango-e2e

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.report.outputs.artifact-id }}
    env:
      # A PR targeting main is still untrusted and keeps on-first-retry.
      PLAYWRIGHT_MAIN_TRACE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tango-dev:latest
          cache-from: type=gha,scope=tango-e2e
          cache-to: type=gha,mode=max,scope=tango-e2e

      - name: Build sample data
        run: docker compose -f sample/docker-compose.yml run --rm --remove-orphans --entrypoint 'python generate.py ./test -o build/output.json' base

      - name: Start E2E services
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml up --wait --wait-timeout 120 --remove-orphans

      - name: Run E2E tests
        id: tests
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml run --rm --remove-orphans --env CI --env PLAYWRIGHT_MAIN_TRACE --entrypoint npm dev run e2e

      - name: Stop E2E services
        if: ${{ always() }}
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml down --volumes --remove-orphans

      - name: Record report source
        if: ${{ always() && env.PLAYWRIGHT_MAIN_TRACE == 'true' }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ -f playwright-report/index.html ]; then
            jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
              --arg attempt "$GITHUB_RUN_ATTEMPT" --arg outcome "$TEST_OUTCOME" \
              '{sha: $sha, run: $run, attempt: $attempt, outcome: $outcome}' > playwright-report/run.json
          else
            echo "No report was generated; Pages publication is blocked." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: ${{ always() }}
        id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PLAYWRIGHT_MAIN_TRACE == 'true' && format('playwright-report-{0}', github.run_attempt) || 'playwright-report' }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          # Zero preserves the repository default for PRs and other non-main runs.
          retention-days: ${{ env.PLAYWRIGHT_MAIN_TRACE == 'true' && 7 || 0 }}
