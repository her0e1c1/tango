name: E2E

on:
  workflow_call:
    outputs:
      artifact-id:
        description: Report artifact from this exact run and attempt
        value: ${{ jobs.e2e.outputs.artifact-id }}
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: tango-e2e

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.report.outputs.artifact-id }}
    env:
      # A PR targeting main is still untrusted and keeps on-first-retry.
      PLAYWRIGHT_MAIN_TRACE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') }}
      PLAYWRIGHT_PRIVACY_VIEWER_ASSETS: test-results/privacy-viewer-assets
      E2E_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tango-dev:latest
          cache-from: type=gha,scope=tango-e2e
          cache-to: type=gha,mode=max,scope=tango-e2e

      - name: Build sample data
        run: docker compose -f sample/docker-compose.yml run --rm --remove-orphans --entrypoint 'python generate.py ./test -o build/output.json' base

      - name: Start E2E services
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml up --wait --wait-timeout 120 --remove-orphans

      - name: Run E2E tests and record every main attempt
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml run --rm --remove-orphans --env CI --env PLAYWRIGHT_MAIN_TRACE --entrypoint npm dev run e2e

      - name: Verify the trace viewer with an isolated fixture
        id: fixture-check
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml run --rm --remove-orphans --entrypoint npm dev run verify:e2e-report:fixture

      - name: Verify the generated report privately in the browser
        if: ${{ !cancelled() && steps.fixture-check.outcome == 'success' }}
        timeout-minutes: 3
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml run --rm --remove-orphans --env PLAYWRIGHT_MAIN_TRACE --entrypoint npm dev run verify:e2e-report

      - name: Read pinned viewer assets from the existing test image
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml run --rm --remove-orphans --entrypoint cp dev -a node_modules/playwright-core/lib/vite test-results/privacy-viewer-assets

      - name: Check private report preparation rejects unexpected credentials
        run: python3 scripts/test-report-privacy.py

      - name: Record a real emulator authentication trace for privacy verification
        if: ${{ success() }}
        run: >-
          docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml run --rm --remove-orphans
          --env CI --env PLAYWRIGHT_HTML_OUTPUT_DIR=test-results/privacy-auth-source/html
          --env PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/privacy-auth-source/report.json
          --entrypoint npm dev run e2e -- test/e2e/account.spec.ts --grep '^ACCOUNT-01 '
          --trace on --output=test-results/privacy-auth-source/results

      - name: Prepare separate private copies without changing original evidence
        if: ${{ success() }}
        run: |
          python3 scripts/prepare-report.py playwright-report test-results/e2e-report.json prepared-reports/full
          python3 scripts/prepare-report.py test-results/privacy-auth-source/html test-results/privacy-auth-source/report.json prepared-reports/auth
          python3 - <<'PY'
          import json
          from pathlib import Path
          counts = json.loads(Path('prepared-reports/auth/manifest.json').read_text())['counts']
          assert counts['traces'] > 0 and counts['jwt_values_removed'] > 0
          PY

      - name: Verify prepared real reports privately in the browser
        if: ${{ success() }}
        timeout-minutes: 3
        run: |
          docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml run --rm --remove-orphans --env PLAYWRIGHT_MAIN_TRACE --entrypoint npm dev run verify:e2e-report -- prepared-reports/full/html prepared-reports/full/report.json
          docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml run --rm --remove-orphans --entrypoint npm dev run verify:e2e-report -- prepared-reports/auth/html prepared-reports/auth/report.json --require-trace

      - name: Retain non-payload preparation manifests only
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: privacy-preparation-manifests
          path: |
            prepared-reports/full/manifest.json
            prepared-reports/auth/manifest.json
          if-no-files-found: error

      - name: Stop E2E services
        if: ${{ always() }}
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.e2e.yaml down --volumes --remove-orphans

      - name: Save HTML report and traces using repository retention
        if: ${{ always() }}
        id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PLAYWRIGHT_MAIN_TRACE == 'true' && format('playwright-report-{0}', github.run_attempt) || 'playwright-report' }}
          path: playwright-report/
          if-no-files-found: ignore
