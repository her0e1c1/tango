name: Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - "**"

# Only superseded runs for the same PR share a group. Reusable and manual runs remain unique.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yaml

  integration:
    name: Integration
    permissions:
      contents: read
    uses: ./.github/workflows/integration.yaml

  checks:
    name: Test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            command: npm run build:sample && npm run build && npm run build:storybook
          - name: Code quality
            command: npm run build:sample && npm run fmt && npm run lint
          - name: Unit coverage
            command: npm run build:sample && npm run test:coverage
            coverage: true
          - name: Storybook
            command: npm run build:sample && npm run test:storybook
            storybook: true
          - name: Sample
            command: npm run fmt:sample && npm run test:sample
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.0.1

      - run: npm ci

      - name: Install Storybook Chromium
        if: ${{ matrix.storybook }}
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload Vitest coverage report
        id: coverage
        if: ${{ matrix.coverage && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: warn

      - name: Add coverage summary
        if: ${{ matrix.coverage && always() }}
        env:
          ARTIFACT_URL: ${{ steps.coverage.outputs.artifact-url }}
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            exit 0
          fi

          {
            echo "## Test coverage"
            echo
            echo "| Metric | Coverage |"
            echo "| --- | ---: |"
            jq -r '
              .total |
              "| Lines | \(.lines.pct)% |",
              "| Statements | \(.statements.pct)% |",
              "| Branches | \(.branches.pct)% |",
              "| Functions | \(.functions.pct)% |"
            ' coverage/coverage-summary.json
            echo
            if [ -n "$ARTIFACT_URL" ]; then
              echo "[Download full coverage report]($ARTIFACT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Run after every dependency conclusion and fail closed unless every canonical job succeeded.
  test:
    name: Test
    if: ${{ always() }}
    needs: [checks, e2e, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$E2E_RESULT" = success
          test "$INTEGRATION_RESULT" = success
