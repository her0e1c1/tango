name: Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - "**"

jobs:
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yaml
    secrets: inherit

  integration:
    name: Integration
    uses: ./.github/workflows/integration.yaml

  checks:
    name: Test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            command: npm run build:sample && npm run build && npm run build:storybook
            registry: true
          - name: Code quality
            command: npm run build:sample && npm run fmt && npm run lint
            registry: true
          - name: Unit coverage
            command: npm run build:sample && npm run test:coverage
            registry: true
            coverage: true
          - name: Storybook
            command: npm run build:sample && npm run test:storybook
            registry: true
            storybook: true
          - name: Sample
            command: npm run fmt:sample && npm run test:sample
            registry: true
    steps:
      - uses: actions/checkout@v7

      - name: Log into registry
        if: ${{ matrix.registry }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.0.1

      - run: npm ci

      - name: Install Storybook Chromium
        if: ${{ matrix.storybook }}
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload Vitest coverage report
        id: coverage
        if: ${{ matrix.coverage && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: warn

      - name: Add coverage summary
        if: ${{ matrix.coverage && always() }}
        env:
          ARTIFACT_URL: ${{ steps.coverage.outputs.artifact-url }}
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            exit 0
          fi

          {
            echo "## Test coverage"
            echo
            echo "| Metric | Coverage |"
            echo "| --- | ---: |"
            jq -r '
              .total |
              "| Lines | \(.lines.pct)% |",
              "| Statements | \(.statements.pct)% |",
              "| Branches | \(.branches.pct)% |",
              "| Functions | \(.functions.pct)% |"
            ' coverage/coverage-summary.json
            echo
            if [ -n "$ARTIFACT_URL" ]; then
              echo "[Download full coverage report]($ARTIFACT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
