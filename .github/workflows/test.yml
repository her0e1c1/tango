name: Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - "**"

# Only superseded runs for the same PR share a group. Reusable and manual runs remain unique.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Manual runs and callers without a PR or push diff keep the full checks.
      run-tests: ${{ (github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.typescript == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'push' }}

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            typescript:
              - '**/*.ts'
              - '**/*.tsx'

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.run-tests == 'true' }}
    name: E2E
    uses: ./.github/workflows/e2e.yaml

  integration:
    needs: changes
    if: ${{ needs.changes.outputs.run-tests == 'true' }}
    name: Integration
    permissions:
      contents: read
    uses: ./.github/workflows/integration.yaml

  storybook:
    needs: changes
    if: ${{ needs.changes.outputs.run-tests == 'true' }}
    name: Storybook
    uses: ./.github/workflows/storybook.yaml

  linter:
    name: Linter
    needs: changes
    uses: ./.github/workflows/linter.yaml
    with:
      lightweight: ${{ needs.changes.outputs.run-tests != 'true' }}

  checks:
    needs: changes
    if: ${{ needs.changes.outputs.run-tests == 'true' }}
    name: Test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            command: npm run build:sample && npm run build
          - name: Unit coverage
            command: npm run build:sample && npm run test:coverage
            coverage: true
          - name: Sample
            command: npm run test:sample
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.0.1

      - run: npm ci

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload Vitest coverage report
        id: coverage
        if: ${{ matrix.coverage && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: warn

      - name: Add coverage summary
        if: ${{ matrix.coverage && always() }}
        env:
          ARTIFACT_URL: ${{ steps.coverage.outputs.artifact-url }}
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            exit 0
          fi

          {
            echo "## Test coverage"
            echo
            echo "| Metric | Coverage |"
            echo "| --- | ---: |"
            jq -r '
              .total |
              "| Lines | \(.lines.pct)% |",
              "| Statements | \(.statements.pct)% |",
              "| Branches | \(.branches.pct)% |",
              "| Functions | \(.functions.pct)% |"
            ' coverage/coverage-summary.json
            echo
            if [ -n "$ARTIFACT_URL" ]; then
              echo "[Download full coverage report]($ARTIFACT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Accept skipped jobs only when the successful change classifier explicitly permits them.
  test:
    name: Test
    if: ${{ always() }}
    needs: [changes, checks, linter, dependency-review, e2e, integration, storybook]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run-tests }}
          LINTER_RESULT: ${{ needs.linter.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          STORYBOOK_RESULT: ${{ needs.storybook.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$LINTER_RESULT" = success
          case "$RUN_TESTS" in
            false) expected=skipped ;;
            true) expected=success ;;
            *) exit 1 ;;
          esac
          test "$CHECKS_RESULT" = "$expected"
          test "$E2E_RESULT" = "$expected"
          test "$INTEGRATION_RESULT" = "$expected"
          test "$STORYBOOK_RESULT" = "$expected"
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
