name: Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - "**"

env:
  VITE_DB_PORT: 8000
  VITE_DB_HOST: localhost

jobs:
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yaml
    secrets: inherit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: hadolint

      - run: mise run lint-docker

      - name: Log into registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.0.1

      - run: npm ci

      - run: npm run ci

      - name: Install Storybook Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Storybook tests
        run: npm run test:storybook

      - name: Upload Vitest coverage report
        id: coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: warn

      - name: Add coverage summary
        if: ${{ always() }}
        env:
          ARTIFACT_URL: ${{ steps.coverage.outputs.artifact-url }}
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            exit 0
          fi

          {
            echo "## Test coverage"
            echo
            echo "| Metric | Coverage |"
            echo "| --- | ---: |"
            jq -r '
              .total |
              "| Lines | \(.lines.pct)% |",
              "| Statements | \(.statements.pct)% |",
              "| Branches | \(.branches.pct)% |",
              "| Functions | \(.functions.pct)% |"
            ' coverage/coverage-summary.json
            echo
            if [ -n "$ARTIFACT_URL" ]; then
              echo "[Download full coverage report]($ARTIFACT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
