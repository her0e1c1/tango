name: Dependabot Auto-merge

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

permissions:
  contents: read

jobs:
  merge:
    name: Merge Dependabot update
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Merge Dependabot update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"

          if [ "$(jq -r '.user.login' <<< "$pr")" != "dependabot[bot]" ]; then
            exit 0
          fi

          if [ "$(jq -r '.state' <<< "$pr")" != open ] || [ "$(jq -r '.base.ref' <<< "$pr")" != main ]; then
            echo "PR is not open against main; skipping merge."
            exit 0
          fi

          if [ "$(jq -r '.head.sha' <<< "$pr")" != "$TESTED_SHA" ]; then
            echo "PR head changed after CI; skipping merge."
            exit 0
          fi

          title="$(jq -r '.title' <<< "$pr")"

          if [[ ! "$title" =~ [[:space:]]from[[:space:]]v?([0-9]+)(\.[^[:space:]]+)?[[:space:]]to[[:space:]]v?([0-9]+)(\.[^[:space:]]+)?([[:space:]]|$) ]]; then
            echo "Could not determine update type from Dependabot PR title; skipping merge."
            exit 0
          fi

          result="$(gh api \
            --method PUT \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$TESTED_SHA")"

          merge_sha="$(jq -er 'select(.merged == true) | .sha' <<< "$result")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "Merged PR #$PR_NUMBER as candidate $merge_sha." >> "$GITHUB_STEP_SUMMARY"

          # GITHUB_TOKEN pushes do not trigger workflows; repository_dispatch is supported.
          jq -n --arg sha "$merge_sha" \
            '{event_type: "dependabot-merged", client_payload: {sha: $sha}}' | \
            gh api --method POST "repos/$REPOSITORY/dispatches" --input -
