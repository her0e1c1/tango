name: Dependabot Auto-merge

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

permissions:
  contents: read

jobs:
  merge:
    name: Merge Dependabot update
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-merge-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Merge Dependabot update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"

          if [ "$(jq -r '.user.login' <<< "$pr")" != "dependabot[bot]" ]; then
            exit 0
          fi

          # A repeated Test completion must not dispatch a previously merged PR again.
          if [ "$(jq -r '.state' <<< "$pr")" != open ] || [ "$(jq -r '.base.ref' <<< "$pr")" != main ]; then
            echo "PR is not open against main; skipping merge."
            exit 0
          fi

          if [ "$(jq -r '.head.sha' <<< "$pr")" != "$TESTED_SHA" ]; then
            echo "PR head changed after CI; skipping merge."
            exit 0
          fi

          title="$(jq -r '.title' <<< "$pr")"

          if [[ ! "$title" =~ [[:space:]]from[[:space:]]v?([0-9]+)(\.[^[:space:]]+)?[[:space:]]to[[:space:]]v?([0-9]+)(\.[^[:space:]]+)?([[:space:]]|$) ]]; then
            echo "Could not determine update type from Dependabot PR title; skipping merge."
            exit 0
          fi

          result="$(gh api \
            --method PUT \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$TESTED_SHA")"

          merge_sha="$(jq -er 'select(.merged == true) | .sha' <<< "$result")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]

          # Keep the exact candidate available for recovery if dispatch cannot be delivered.
          {
            echo "Merged PR #$PR_NUMBER as candidate $merge_sha."
            echo 'If dispatch fails, rerunning this merge job skips the closed PR. After authorization, retry the handoff with:'
            echo '```sh'
            echo "gh api --method POST repos/$REPOSITORY/dispatches -f event_type=dependabot-merged -f 'client_payload[sha]=$merge_sha' -F 'client_payload[pr]=$PR_NUMBER'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # GITHUB_TOKEN pushes do not trigger workflows; repository_dispatch is supported.
          payload="$(jq -n --arg sha "$merge_sha" --argjson pr "$PR_NUMBER" \
            '{event_type: "dependabot-merged", client_payload: {sha: $sha, pr: $pr}}')"
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$REPOSITORY/dispatches" --input - <<< "$payload"; then
              echo "Dispatched Firebase and Pages candidate $merge_sha from PR #$PR_NUMBER." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" != 3 ]; then
              sleep 5
            fi
          done

          echo "Dispatch failed for candidate $merge_sha; delivery is unconfirmed. Use the recovery command above after authorization." >> "$GITHUB_STEP_SUMMARY"
          exit 1
