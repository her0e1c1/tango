name: Storybook

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - run: mise run init

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Exercise the mise task's CLI startup path explicitly; smoke-test exits after successful startup.
      - name: Check Storybook startup
        timeout-minutes: 5
        run: mise run storybook -- -- --ci --smoke-test --host 127.0.0.1 --port 6006 --exact-port

      - name: Build Storybook
        run: mise run build-storybook

      - name: Run Playwright integration tests
        run: mise run test-playwright

      - name: Upload Storybook diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-diagnostics
          path: |
            debug-storybook.log
            test-results/playwright/
          if-no-files-found: ignore
