version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Update Playwright manually to keep the npm package, container image,
    # and remote server versions aligned.
    ignore:
      - dependency-name: "@playwright/test"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
