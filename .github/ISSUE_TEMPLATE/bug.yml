name: Bug report
description: Report a reproducible bug.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: Describe what currently happens.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Provide the steps needed to reproduce the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what actually happened.
    validations:
      required: true
  - type: dropdown
    id: change-areas
    attributes:
      label: Change areas
      description: Select every area changed by this issue.
      multiple: true
      options:
        - ci
        - ui
        - test
        - dev
        - docs
        - dependencies
    validations:
      required: true
