name: Improvement proposal
description: Propose an improvement to the product or developer experience.
title: "[Improvement]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe what this improvement should achieve.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Explain why this improvement is needed.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe what should and should not change.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Describe the conditions required for completion.
    validations:
      required: true
  - type: dropdown
    id: change-areas
    attributes:
      label: Change areas
      description: Select every area changed by this issue.
      multiple: true
      options:
        - ci
        - ui
        - test
        - dev
        - docs
        - dependencies
    validations:
      required: true
