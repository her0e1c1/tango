min_version = "2026.4.8"
monorepo_root = true

[monorepo]
config_roots = ["sample"]

[tools]
gcloud = "581.0.0"
hadolint = "2.15.0"
node = "24.15.0"
npm = "12.0.1"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
COMPOSE_FILE = ".devcontainer/compose.yaml:.devcontainer/compose.local.yaml"
# Compose files live under .devcontainer, so use the project-root env file.
COMPOSE_ENV_FILES = ".env"

[tasks]
up = "docker compose up --wait --wait-timeout 120 --remove-orphans -d db"
dev-up = "docker compose --env-file .env.dev up --wait --wait-timeout 120 --remove-orphans -d db auth"
lint-docker = "hadolint --failure-threshold warning Dockerfile sample/Dockerfile"
down = "docker compose down --remove-orphans"
ps = "docker compose ps"

[tasks.git-cleanup]
file = "scripts/cleanup-branches.sh"

[tasks.test-sample]
run = [{ task = "//sample:test" }]

[tasks.gcloud-auth-login]
interactive = true
run = "gcloud auth login"

[tasks.setup-github-oidc]
file = "scripts/setup-github-oidc.sh"

[tasks.init]
depends = ["init-deps"]
run = "test -f .env || cp .env.example .env"

[tasks.init-deps]
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci"

[tasks.dev]
depends = ["//sample:build", "dev-up"]
run = "npm start -- --open --mode dev"

[tasks.storybook]
depends = ["//sample:build"]
run = "npm run storybook"

[tasks.test]
depends = ["//sample:build"]
# Full-suite file concurrency can exhaust local CPU enough to trip existing five-second test timeouts.
run = ["npm run test:unit -- --no-file-parallelism", { task = "//sample:test" }]

[tasks.test-unit]
depends = ["//sample:build"]
run = "npm run test:unit -- --no-file-parallelism"

[tasks.test-integration]
depends = ["up"]
run = "npm run test:integration"

[tasks.test-storybook]
depends = ["//sample:build"]
run = "npm run test:storybook"

[tasks.coverage]
depends = ["//sample:build"]
run = "npm run test:coverage -- --no-file-parallelism"

[tasks.fmt]
depends = ["//sample:build"]
run = ["npm run fmt", { task = "//sample:fmt" }]

[tasks.fmt-fix]
run = [
  { task = "//sample:fmt-fix" },
  { task = "//sample:build" },
  "npm run fmt:fix",
]

[tasks.lint]
depends = ["//sample:build"]
run = "npm run lint"

[tasks.lint-fix]
depends = ["//sample:build"]
run = "npm run lint:fix"

[tasks.build]
depends = ["//sample:build"]
run = ["npm run build", "npm run build:storybook"]

[tasks.build-storybook]
depends = ["//sample:build"]
run = "npm run build:storybook"

[tasks.e2e]
depends = ["//sample:build"]
env = { COMPOSE_FILE = ".devcontainer/compose.yaml:.devcontainer/compose.e2e.yaml" }
run = """
export COMPOSE_PROJECT_NAME="tango-e2e-$$"

cleanup() {
  docker compose down --volumes --remove-orphans
}
trap cleanup EXIT

# The E2E override forbids remote pulls, so local runs must create the same image that CI loads before startup.
docker compose build app
docker compose up --wait --wait-timeout 120 --remove-orphans
docker compose run --rm --remove-orphans --env CI --entrypoint npm dev run e2e
"""

[tasks.check]
depends = ["init"]
# Keep unit tests out of the static-check concurrency so CPU contention cannot turn their short timeouts into flakes.
run = [{ tasks = ["fmt", "lint", "lint-docker"] }, { task = "test-unit" }]

[tasks.fix]
depends = ["init"]
run = [{ task = "fmt-fix" }, { task = "lint-fix" }]

[tasks.clean]
confirm = "削除してよいですか？"
run = [
  "docker compose down --volumes --remove-orphans",
  "rm -rf node_modules build storybook-static test-results playwright-report coverage .firebase sample/build",
]
