monorepo_root = true

[monorepo]
config_roots = ["sample"]

[tools]
hadolint = "2.15.0"
node = "24.15.0"
npm = "12.0.1"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
COMPOSE_FILE = ".devcontainer/compose.yaml:.devcontainer/compose.local.yaml"
# Compose files live under .devcontainer, so use the project-root env file.
COMPOSE_ENV_FILES = ".env"

[tasks]
up = "docker compose up --wait --wait-timeout 120 --remove-orphans -d db"
dev-up = "docker compose --env-file .env.dev up --wait --wait-timeout 120 --remove-orphans -d db auth"
test-sample = "mise run //sample:test"
lint-docker = "hadolint --failure-threshold warning Dockerfile sample/Dockerfile"
down = "docker compose down --remove-orphans"
ps = "docker compose ps"

[tasks.init]
depends = ["init-deps"]
run = "test -f .env || cp .env.example .env"

[tasks.init-deps]
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci"

[tasks.dev]
depends = ["build-sample", "dev-up"]
run = "npm start -- --open --mode dev"

[tasks.storybook]
depends = ["build-sample"]
run = "npm run storybook"

[tasks.test]
depends = ["build-sample", "up"]
run = [
  "npm test",
  { task = "test-sample" },
]

[tasks.test-unit]
depends = ["build-sample"]
run = "npm run test:unit"

[tasks.test-firestore]
depends = ["up"]
run = "npm run test:firestore"

[tasks.test-storybook]
depends = ["build-sample"]
run = "npm run test:storybook"

[tasks.coverage]
depends = ["build-sample", "up"]
run = "npm run test:coverage"

[tasks.fmt]
run = [
  "npm run fmt",
  "mise run //sample:fmt",
]

[tasks.fmt-fix]
run = [
  "npm run fmt:fix",
  "mise run //sample:fmt-fix",
]

[tasks.lint]
depends = ["build-sample"]
run = "npm run lint"

[tasks.lint-fix]
depends = ["build-sample"]
run = "npm run lint:fix"

[tasks.build-sample]
run = "mise run //sample:build"

[tasks.build]
depends = ["build-sample"]
run = [
  "npm run build",
  "npm run build:storybook",
]

[tasks.build-storybook]
depends = ["build-sample"]
run = "npm run build:storybook"

[tasks.e2e]
depends = ["build-sample"]
run = """
export COMPOSE_FILE=.devcontainer/compose.yaml:.devcontainer/compose.e2e.yaml
export COMPOSE_PROJECT_NAME="tango-e2e-$$"

cleanup() {
  docker compose down --volumes --remove-orphans
}
trap cleanup EXIT

docker compose up --wait --wait-timeout 120 --remove-orphans
docker compose run --rm --remove-orphans --env CI --entrypoint npm dev run e2e
"""

[tasks.check]
depends = ["init"]
run = [{ tasks = ["fmt", "lint", "lint-docker", "test-unit"] }]

[tasks.fix]
depends = ["init"]
run = [{ tasks = ["fmt-fix", "lint-fix"] }]

[tasks.ci]
depends = ["init"]
run = "npm run ci"

[tasks.clean]
confirm = "削除してよいですか？"
run = [
  "docker compose down --volumes --remove-orphans",
  "rm -rf node_modules build storybook-static test-results playwright-report coverage .firebase sample/build",
]
