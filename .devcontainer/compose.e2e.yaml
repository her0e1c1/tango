# E2E-only services and environment. The base compose file stays focused on
# local development; this override supplies the app env, remote browser, and
# Playwright runner env needed by browser tests.
services:
  auth:
    pull_policy: never
    command:
      - firebase
      - emulators:start
      - --only
      - auth
      - --project
      - tango-e2e
      - --config
      - firebase.json
    networks:
      default:
        aliases:
          - auth.app.test

  app:
    env_file:
      - ../.env.e2e
    pull_policy: never

  browser:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    init: true
    user: pwuser
    # --unsafe forwards the scoped Chromium origin flag; override its artifact path so remote downloads never inherit
    # the runner-only /workspace path.
    command: >-
      npx -y playwright@1.61.1 run-server --port 3000 --host 0.0.0.0 --unsafe
      --artifacts-dir /tmp/playwright-artifacts
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      start_period: 5s
      interval: 1s
      retries: 60

  dev:
    pull_policy: never
    environment:
      PLAYWRIGHT_BASE_URL: http://app.test:4173
      PW_TEST_CONNECT_WS_ENDPOINT: ws://browser:3000/
